name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  # Debug info is most of a build's disk footprint and a large share of its
  # link time, and nothing in CI reads it. Leaving it out keeps the dependency
  # caches small enough to stay under the repository's 10 GB cache limit.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The tests of these crates don't build in this repository: the release
  # tooling leaves out their dev-dependencies, and some read fonts from Zed's
  # `assets/` folder (docs/testing.md). Every other crate's tests run.
  TEST_EXCLUDES: >-
    --exclude gpui-pre
    --exclude gpui-pre-macos
    --exclude gpui-pre-macros
    --exclude gpui-pre-sum-tree
    --exclude gpui-pre-web
    --exclude gpui-pre-wgpu
    --exclude gpui-pre-zlog

# The `test` job relies on the dependency cache that
# `actions-rust-lang/setup-rust-toolchain` installs (Swatinem/rust-cache).
# Only `main` saves caches. Pull requests restore the closest `main` cache
# through rust-cache's prefix fallback, so they never crowd `main`'s caches
# out of the 10 GB limit.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      # gpui-pre-macros holds code the release tooling generates, which
      # rustfmt would rewrite and later imports from upstream would then
      # conflict with (docs/upstream.md).
      - name: Check formatting
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 | jq -j '
            .packages[] | select(.name != "gpui-pre-macros") | "-p \(.name) "')
          cargo fmt --check $packages

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            run_on: ubuntu-latest
          - name: Windows
            run_on: windows-latest
          - name: macOS
            run_on: macos-latest
    runs-on: ${{ matrix.run_on }}
    defaults:
      run:
        # `$TEST_EXCLUDES` must word-split, which PowerShell does not do.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # Replaces the system `ld` on Linux and is a no-op elsewhere.
      - uses: rui314/setup-mold@v1
      # Headers for GPUI's Linux platform, and lavapipe, the software Vulkan
      # driver the screenshot tests draw with.
      - name: Install system dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libvulkan1 mesa-vulkan-drivers
      # gpui-pre-apple's build script compiles its shaders with Xcode's Metal
      # compiler, which Xcode 26 installs as a separate component.
      - name: Install the Metal toolchain
        if: ${{ runner.os == 'macOS' }}
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
      # Clippy type-checks every crate it lints, so it stands in for
      # `cargo check`.
      - name: Clippy
        run: cargo clippy --workspace --locked -- --deny warnings
      # `--tests` leaves out the examples, which need the missing
      # dev-dependencies too, and the doc tests, where gpui-pre-mobile's are
      # sketches that don't compile.
      - name: Test
        run: cargo test --workspace $TEST_EXCLUDES --tests --locked
      - name: Upload screenshot failures
        if: ${{ failure() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-failures
          path: crates/gpui_screenshot/tests/screenshots/failures/
          if-no-files-found: ignore
