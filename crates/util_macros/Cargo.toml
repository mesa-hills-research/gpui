[package]
name = "mhr-util-macros"
version = "0.1.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "Utility macros of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "macros"]
