[package]
name = "mhr-gpui-screenshot"
version = "0.1.7"
edition = { workspace = true }
publish = true
# The code is Apache-2.0. The bundled fonts keep the licences in fonts/.
license = "Apache-2.0 AND OFL-1.1 AND Bitstream-Vera"
description = "Golden-image screenshot tests for GPUI views, rendered headlessly on Linux, for mhr-gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "screenshot", "testing", "golden", "snapshot"]
categories = ["gui", "development-tools::testing"]

[lib]
path = "src/gpui_screenshot.rs"
name = "gpui_screenshot"
doctest = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
image = { workspace = true }
png = "0.18"
sha2 = { workspace = true }

[dev-dependencies]
swash = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { workspace = true, features = ["font-kit", "test-support"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui_windows = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
