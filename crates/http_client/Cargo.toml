[package]
name = "mhr-http-client"
version = "0.1.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The HTTP client interface of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "http", "client"]
categories = ["web-programming::http-client"]

[package.metadata.gpui-pre]
zed-crate = "http_client"
zed-version = "0.1.0"
zed-rev = "279fe070bb389b79652e52065b2f001edcc0b11b"

[lib]
path = "src/http_client.rs"
doctest = false
name = "http_client"

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
async-compression = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true }
futures = { workspace = true }
http-body = { workspace = true }
http = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]

[lints]
workspace = true
