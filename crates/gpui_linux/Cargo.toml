[package]
name = "mhr-gpui-linux"
version = "0.1.1"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The Linux and FreeBSD platform of mhr-gpui, a fork of Zed's gpui, on Wayland and X11"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gui", "gpui", "linux", "wayland", "x11"]
categories = ["gui", "os::linux-apis"]

[package.metadata.cargo-shear]
ignored = ["scap"]

[package.metadata.gpui-pre]
zed-crate = "gpui_linux"
zed-version = "0.1.0"
zed-rev = "279fe070bb389b79652e52065b2f001edcc0b11b"

[lib]
path = "src/gpui_linux.rs"
doctest = false
name = "gpui_linux"

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = [
    "gpui_wgpu",
    "ashpd/wayland",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "gpui/wayland",
]
x11 = [
    "gpui_wgpu",
    "ashpd",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = ["gpui/screen-capture", "scap"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit = { workspace = true }
accesskit_unix = { workspace = true }
anyhow = { workspace = true }
bytemuck = "1"
collections = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true }
gpui_util = { workspace = true }
gpui_wgpu = { workspace = true, optional = true, features = ["font-kit"] }
http_client = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
smol = { workspace = true }
strum = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
calloop = "0.14.3"
notify-rust = { workspace = true }
raw-window-handle = { workspace = true }
ashpd = { workspace = true, optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { version = "0.8.0", default-features = false, optional = true }
scap = { workspace = true, optional = true }
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen", "log"], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"], optional = true }
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
], optional = true }
xim = { features = ["x11rb-xcb", "x11rb-client"], package = "zed-xim", version = "0.4.0-zed", optional = true }

[lints]
workspace = true
