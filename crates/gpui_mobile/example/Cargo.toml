[package]
name = "gpui-mobile-example"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPUI example app for Android and iOS"
publish = false

# A workspace of its own, so it keeps its own profiles and [patch], and the
# workspace's `cargo test` stays off the full GPUI Kit build.
[workspace]

[lib]
name = "gpui_mobile_example"
crate-type = ["cdylib", "staticlib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "gpui-example"
path = "src/main.rs"

[dependencies]
# GPUI Kit 0.7.1 is built against the gpui-pre crates, which this workspace's
# mhr crates replace under new names. A [patch] can't rename a crate, so the
# example builds again once GPUI Kit is built on the mhr crates.
gpui-kit = { version = "=0.7.1", default-features = false, features = ["component"] }
gpui-mobile = { package = "mhr-gpui-mobile", path = ".." }
gpui = { package = "mhr-gpui", path = "../../gpui", default-features = false }
reqwest_client = { package = "mhr-reqwest-client", path = "../../reqwest_client" }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls"] }
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
