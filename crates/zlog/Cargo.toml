[package]
name = "mhr-zlog"
version = "0.1.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The logger of mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "logging", "log"]
categories = ["development-tools::debugging"]

[package.metadata.gpui-pre]
zed-crate = "zlog"
zed-version = "0.1.0"
zed-rev = "279fe070bb389b79652e52065b2f001edcc0b11b"

[lib]
path = "src/zlog.rs"
doctest = false
name = "zlog"

[features]
default = []

[dependencies]
collections = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
