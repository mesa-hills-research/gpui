[package]
name = "mhr-http-client-tls"
version = "0.1.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "The rustls client configuration of mhr-reqwest-client, for mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "tls", "rustls"]
categories = ["web-programming::http-client", "cryptography"]

[package.metadata.gpui-pre]
zed-crate = "http_client_tls"
zed-version = "0.1.0"
zed-rev = "279fe070bb389b79652e52065b2f001edcc0b11b"

[lib]
path = "src/http_client_tls.rs"
doctest = false
test = false
name = "http_client_tls"

[features]
test-support = []

[dependencies]
log = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
webpki-roots = { workspace = true }

[lints]
workspace = true
