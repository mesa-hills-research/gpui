[package]
name = "mhr-reqwest-client"
version = "0.1.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "An HTTP client for mhr-gpui, a fork of Zed's gpui, built on reqwest"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "http", "reqwest"]
categories = ["web-programming::http-client"]

[package.metadata.gpui-pre]
zed-crate = "reqwest_client"
zed-version = "0.1.0"
zed-rev = "279fe070bb389b79652e52065b2f001edcc0b11b"

[lib]
path = "src/reqwest_client.rs"
doctest = false
name = "reqwest_client"

[features]
test-support = []

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http_client = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
regex = { workspace = true }
reqwest = { workspace = true }
gpui_util = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
http_client_tls = { workspace = true }

[lints]
workspace = true
