[package]
name = "mhr-sum-tree"
version = "0.1.0"
edition = { workspace = true }
publish = true
license = "Apache-2.0"
description = "A sum tree, a concurrency-friendly B-tree, used by mhr-gpui, a fork of Zed's gpui"
repository = { workspace = true }
rust-version = { workspace = true }
readme = "README.md"
keywords = ["gpui", "tree", "b-tree", "rope"]
categories = ["data-structures"]

[package.metadata.cargo-shear]
ignored = ["tracing"]

[package.metadata.gpui-pre]
zed-crate = "sum_tree"
zed-version = "0.1.0"
zed-rev = "279fe070bb389b79652e52065b2f001edcc0b11b"

[lib]
path = "src/sum_tree.rs"
doctest = false
name = "sum_tree"

[features]
test-support = ["proptest"]

[dependencies]
heapless = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
ztracing = { workspace = true }
tracing = { workspace = true }
proptest = { workspace = true, optional = true }

[lints]
workspace = true
